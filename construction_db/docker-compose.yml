# Everything runs in Docker. Run all commands from the construction_db folder.
#
#   docker compose up -d db minio            start the database and evidence storage
#   docker compose run --rm storage-init     create the evidence and export buckets (once)
#   docker compose run --rm migrate up       apply migrations
#   docker compose up -d --build api         build and start the API
#   docker compose up -d --build worker      the reminder jobs and audit packs (with redis and mailpit)
#
# DATABASE_URL is built here from the POSTGRES_* values in .env,
# so the password only ever lives in one place. Likewise the MinIO root
# login is S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY.

x-database-url: &database-url postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable

services:
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: *database-url
      S3_ENDPOINT: http://minio:9000
      # Presigned URLs are used outside Docker, so they must name a host the
      # client can reach. Set S3_PUBLIC_ENDPOINT in .env to test from a phone.
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy


  # The reminder jobs (M11) and the audit pack builder (M12). Needs Redis for
  # its schedule; emails go to Mailpit locally (http://localhost:8025 shows
  # them); packs go to the export bucket in MinIO.
  worker:
    build: .
    entrypoint: ["/worker"]
    env_file: .env
    environment:
      DATABASE_URL: *database-url
      REDIS_URL: redis://redis:6379/0
      SMTP_URL: ${SMTP_URL:-smtp://mailpit:1025?from=reminders@siteproof.local}
      S3_ENDPOINT: http://minio:9000
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"
      - "1025:1025"

  db:
    image: postgres:16-alpine
    env_file: .env
    ports:
      # Only needed if you want to connect a GUI tool (DBeaver, pgAdmin) from Windows.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local stand-in for S3. MinIO no longer publishes images; Chainguard's free
  # build only has "latest", so it is pinned by digest (same as storagetest.Image).
  minio:
    image: cgr.dev/chainguard/minio@sha256:0a01100085e30fb08d2f39e39c9f5c9d83a95707f220b007d813b690cd41622d
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
      # For the healthcheck: the image has mc but no curl or wget.
      MC_HOST_local: http://${S3_ACCESS_KEY_ID}:${S3_SECRET_ACCESS_KEY}@localhost:9000
      MC_CONFIG_DIR: /tmp/.mc
    ports:
      - "9000:9000"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-off tool. Creates the evidence bucket like production: Object Lock on,
  # every object retained by default. GOVERNANCE for 1 day, so local data can
  # still be wiped with "docker compose down -v". And the export bucket (M12):
  # versioning on, no lock, packs deleted after 7 days.
  storage-init:
    image: cgr.dev/chainguard/minio-client@sha256:8419d1a4518c12889cf59f11043cb2318175841eb727c415e0aacbd0a749846f
    profiles: ["tools"]
    environment:
      MC_HOST_local: http://${S3_ACCESS_KEY_ID}:${S3_SECRET_ACCESS_KEY}@minio:9000
    entrypoint: ["sh", "-c"]
    command:
      - >-
        mc mb --ignore-existing --with-lock local/${S3_BUCKET} &&
        mc retention set --default governance 1d local/${S3_BUCKET} &&
        mc mb --ignore-existing local/${S3_EXPORT_BUCKET} &&
        mc version enable local/${S3_EXPORT_BUCKET} &&
        mc ilm rule add --expire-days 7 --noncurrent-expire-days 1 local/${S3_EXPORT_BUCKET}
    depends_on:
      minio:
        condition: service_healthy

  # One-off tool, never started by "docker compose up".
  # Usage: docker compose run --rm migrate <up | down 1 | version | force N>
  migrate:
    image: migrate/migrate:v4.20.1
    profiles: ["tools"]
    volumes:
      - ./migrations:/migrations
    entrypoint: ["migrate", "-path=/migrations", "-database", *database-url]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
