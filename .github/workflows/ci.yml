name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        # The Go module lives in construction_db/, not the repo root.
        working-directory: construction_db
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: construction_db/go.mod
          cache-dependency-path: construction_db/go.sum

      - name: Check formatting (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need 'gofmt -w':"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Import boundary (core must not import editions)
        run: go test -run 'TestImportBoundary|TestViolations' ./internal/archtest/

      - name: Test
        run: go test -race ./...

      # The date-sensitive app tests again, as if at 00:30 SAST: Postgres runs
      # under libfaketime (dbtest/faketime, built here in seconds) and the API
      # on the same moved clock. Without -race: the step above already ran
      # these under the race detector; this one checks dates. Keep the list in
      # step with construction_db/CLAUDE.md (Commands).
      - name: Test dates as if at 00:30 SAST
        env:
          SITEPROOF_TEST_SAST: "00:30"
          DATE_TESTS: '^(TestRaise|TestAction|TestIncidentAction|TestCorrectedFindingActions|TestWaivers|TestCloseout|TestRemovedSupervisor|TestSignIn|TestOnTheSpot|TestNotSigned|TestReminders|TestEmail|TestJobRuns|TestWorker|TestSignatureWorkerLinks|TestVault|TestSafetyFile|TestDocumentRetraction|TestAppointments)'
        run: |
          set -o pipefail
          go test -count=1 -v -run "$DATE_TESTS" ./internal/app/ 2>&1 | tee sast.log | grep -E '^(--- FAIL|FAIL|ok)|running as if'
          # Fails if the run fell back to the real time.
          grep -q 'running as if at .* 00:30' sast.log

      - name: Build
        run: go build ./...

  docker:
    name: Docker image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Only publish on pushes to main. PRs just prove the image builds.
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (and push on main)
        uses: docker/build-push-action@v7
        with:
          context: construction_db
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max